<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses | Global NursePrep</title>
    <link rel="stylesheet" href="lms-courses.css">
    <link rel="stylesheet" href="../css/site-loader.css">
    <script src="../js/site-loader.js"></script>
    <script defer src="../learning-core.js"></script>
    <script defer src="lms-data.js"></script>
    <script defer src="lms-catalog.js"></script>
</head>
<body class="lms-body" data-lms-page="catalog">
    <nav class="lms-nav">
        <a class="lms-brand" href="../homepage.html">
            <img src="../logo/finalLogo.jpg" alt="Global NursePrep logo">
            <span>Global <span style="color:#008c95;">Nurse</span>Prep</span>
        </a>
        <div class="lms-nav-links">
            <a href="../Dashboard.html">Dashboard</a>
            <a href="../my-learnings.html">My Learnings</a>
            <a href="../meetings.html">Lectures</a>
            <a href="../login.html" id="authLink">Login</a>
        </div>
    </nav>

    <main class="lms-shell">
        <section class="lms-hero" id="selectedCourse">
            <div>
                <p class="lms-kicker">Nursing Learning System</p>
                <h1 id="selectedTitle">Courses built around lectures, checkpoints, QBank practice, and readiness.</h1>
                <p class="lms-muted" id="selectedSummary">Choose a course to view its structure.</p>
                <div class="lms-hero-metrics" id="selectedMetrics"></div>
                <div class="lms-actions" style="margin-top:1rem;">
                    <button type="button" class="lms-button" id="enrollBtn">Register to Enroll</button>
                    <a class="lms-secondary" id="workspaceBtn" href="#">Open Workspace</a>
                </div>
            </div>
            <div>
                <img id="selectedImage" src="" alt="">
            </div>
        </section>

        <section class="lms-panel" style="margin-top:1rem; padding:1rem;">
            <div class="lms-toolbar">
                <input class="lms-input" id="courseSearch" type="search" placeholder="Search by course, subject, system, or concept">
                <select class="lms-select" id="categoryFilter"></select>
                <select class="lms-select" id="levelFilter"></select>
            </div>
            <div class="lms-tabs" id="courseTabs">
                <button class="lms-tab active" data-view="all">All Courses</button>
                <button class="lms-tab" data-view="enrolled">My Enrolled</button>
                <button class="lms-tab" data-view="lectures">Lecture Heavy</button>
                <button class="lms-tab" data-view="exam">Exam Prep</button>
            </div>
            <div class="lms-grid" id="courseGrid"></div>
        </section>
    </main>
</body>
</html>
