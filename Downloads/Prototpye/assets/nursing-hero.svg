<svg xmlns="http://www.w3.org/2000/svg" width="820" height="620" viewBox="0 0 820 620" role="img" aria-label="Nursing illustration">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eef4ff" />
      <stop offset="1" stop-color="#ffffff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0b1f3a" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect x="0" y="0" width="820" height="620" rx="40" fill="url(#bg)" />
  <circle cx="690" cy="150" r="120" fill="#e8f0fe" />
  <circle cx="120" cy="520" r="92" fill="#e8f0fe" />

  <g filter="url(#shadow)">
    <rect x="140" y="130" width="540" height="410" rx="34" fill="#ffffff" stroke="#e8eaed" />
  </g>

  <!-- Nurse avatar -->
  <g transform="translate(250 185)">
    <!-- Hair -->
    <path d="M70 150c0-70 55-120 135-120s135 50 135 120c0 26-8 50-22 70-10-52-52-90-113-90s-103 38-113 90c-14-20-22-44-22-70z" fill="#0b1f3a" opacity="0.95"/>

    <!-- Face -->
    <circle cx="205" cy="155" r="92" fill="#ffd7c2"/>
    <!-- Neck -->
    <rect x="182" y="238" width="46" height="44" rx="18" fill="#ffc8ad"/>

    <!-- Cap -->
    <path d="M132 120c22-36 58-58 101-58s79 22 101 58c-28 18-64 28-101 28s-73-10-101-28z" fill="#eef4ff" stroke="#dfe7ff" stroke-width="4"/>
    <rect x="186" y="86" width="38" height="38" rx="10" fill="#ffffff" stroke="#dfe7ff" stroke-width="4"/>
    <path d="M205 96v18M196 105h18" stroke="#1a73e8" stroke-width="6" stroke-linecap="round"/>

    <!-- Scrubs -->
    <path d="M92 330c18-50 60-80 113-80h0c53 0 95 30 113 80l18 80H74l18-80z" fill="#eef4ff" stroke="#e2e7ef" stroke-width="4"/>
    <path d="M205 252l-56 56 56 44 56-44-56-56z" fill="#ffffff" stroke="#e2e7ef" stroke-width="4"/>

    <!-- Badge -->
    <rect x="276" y="312" width="80" height="56" rx="16" fill="#ffffff" stroke="#e2e7ef" stroke-width="4"/>
    <circle cx="302" cy="340" r="10" fill="#1a73e8" opacity="0.9"/>
    <path d="M326 332h22M326 348h30" stroke="#5f6368" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Heartbeat line -->
  <g transform="translate(470 334)">
    <path d="M0 46h60l16-24 22 46 22-62 18 40h72" fill="none" stroke="#1a73e8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M246 30c18-14 42-10 54 6 13 18 7 43-14 57-15 10-30 21-40 30-10-9-25-20-40-30-21-14-27-39-14-57 12-16 36-20 54-6z" fill="#0b1f3a" opacity="0.9"/>
  </g>

  <!-- Decorative pills -->
  <g fill="#ffffff" stroke="#e8eaed">
    <rect x="176" y="486" width="148" height="48" rx="24"/>
    <rect x="340" y="486" width="220" height="48" rx="24"/>
  </g>
  <g fill="#0b1f3a" opacity="0.9">
    <rect x="196" y="504" width="42" height="12" rx="6"/>
    <rect x="354" y="504" width="70" height="12" rx="6"/>
    <rect x="432" y="504" width="110" height="12" rx="6" opacity="0.55"/>
  </g>
</svg>

