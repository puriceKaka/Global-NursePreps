<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Global NursePrep</title>
    <link rel="stylesheet" href="forgot-password.css">
    <link rel="stylesheet" href="css/site-loader.css">
    <script src="js/site-loader.js"></script>
</head>
<body>
    <header class="public-nav">
        <a class="public-brand" href="Dashboard.html">
            <span class="brand-logo">
                <img src="logo/Screenshot_20260421-123818.jpg" alt="Global NursePrep logo">
            </span>
            <span>Global <span class="brand-nurse">Nurse</span>Prep</span>
        </a>
        <nav aria-label="Primary navigation">
            <a href="Dashboard.html#home">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Sign Up</a>
        </nav>
    </header>

    <main class="reset-shell">
        <section class="reset-card">
            <div class="reset-copy">
                <p class="eyebrow">Account recovery</p>
                <h1>Reset your password</h1>
                <p>Enter the email used for your Global NursePrep account and create a new password.</p>
                <div class="reset-preview" aria-hidden="true">
                    <img src="logo/home%20image.jpg" alt="">
                </div>
            </div>

            <form class="reset-form" id="resetForm">
                <label class="field">
                    <span>Email</span>
                    <input type="email" id="emailInput" autocomplete="email" placeholder="Enter email" required>
                </label>

                <label class="field">
                    <span>New password</span>
                    <input type="password" id="passwordInput" autocomplete="new-password" placeholder="At least 6 characters" required minlength="6">
                    <small>Use at least 6 characters.</small>
                </label>

                <label class="field">
                    <span>Confirm password</span>
                    <input type="password" id="confirmPasswordInput" autocomplete="new-password" placeholder="Repeat password" required minlength="6">
                </label>

                <div class="message hidden" id="messageBox" role="alert"></div>

                <button type="submit" class="primary-button" id="resetBtn">Reset password</button>
                <a class="secondary-button" href="login.html">Back to login</a>
            </form>
        </section>
    </main>

    <footer class="auth-footer">
        <div>Powered by Teams Technologies</div>
    </footer>

    <script src="js/auth-security.js"></script>
    <script src="forgot-password.js"></script>
</body>
</html>
